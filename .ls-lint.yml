# File & folder naming — checked by `pnpm lint` (ls-lint.org).
#
# Convention: kebab-case everywhere (files and folders). Component names stay
# PascalCase in code; only the file name is kebab-case.
#   customer-drawer.tsx  -> export function CustomerDrawer()
#   use-resize-handle.ts -> export function useResizeHandle()
#   customers.api.ts     -> role suffix after a dot: .api / .queries / .store
#
# Inside a pages/ folder the folder already says "page", so files must NOT end
# in -page:  pages/not-found.tsx (ok)  pages/not-found-page.tsx (fails)

ls:
  "{apps,packages}/*/src":
    .dir: kebab-case
    .ts: kebab-case
    .tsx: kebab-case
    .*.ts: kebab-case
    .*.tsx: kebab-case
    .css: kebab-case
    .json: kebab-case
    .png: kebab-case
    .jpg: kebab-case
    .jpeg: kebab-case
    .svg: kebab-case
    .webp: kebab-case
    .avif: kebab-case
    .gif: kebab-case

  "{apps,packages}/*/src/**/pages":
    # kebab-case whose last segment is not "page" (Go regex has no lookahead).
    .tsx: regex:([a-z0-9]+-)*([a-z0-9]{1,3}|[a-z0-9]{5,}|[a-oq-z0-9][a-z0-9]{3}|p[b-z0-9][a-z0-9]{2}|pa[a-fh-z0-9][a-z0-9]|pag[a-df-z0-9])

  "{apps,packages}":
    .dir: kebab-case

ignore:
  - node_modules
  - "**/node_modules"
  - "**/dist"
